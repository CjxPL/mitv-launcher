name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Klucz leży w repo zaszyfrowany; sekret LAUNCHER_SIGNING_KEY jest hasłem do niego i do keystore'a.
      - name: Klucz podpisu
        env:
          LAUNCHER_SIGNING_KEY: ${{ secrets.LAUNCHER_SIGNING_KEY }}
        run: |
          if [ -n "$LAUNCHER_SIGNING_KEY" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/release.jks.enc \
              -out "$RUNNER_TEMP/release.jks" -pass env:LAUNCHER_SIGNING_KEY
            echo "LAUNCHER_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Brak sekretu LAUNCHER_SIGNING_KEY – APK podpisany kluczem testowym, wydanie nie zostanie opublikowane."
          fi

      - name: Budowanie
        env:
          LAUNCHER_VERSION_CODE: ${{ github.run_number }}
          LAUNCHER_KEYSTORE_PASSWORD: ${{ secrets.LAUNCHER_SIGNING_KEY }}
        run: |
          chmod +x gradlew
          # Błędy kompilacji wypisujemy jako adnotacje, bo są czytelne bez pobierania logów.
          if ! ./gradlew --no-daemon assembleRelease > "$RUNNER_TEMP/build.log" 2>&1; then
            grep -E "^e: |error:|What went wrong|Execution failed|Could not |requires|Dependency" -A3 "$RUNNER_TEMP/build.log" | head -60 | while IFS= read -r line; do echo "::error::${line}"; done
            tail -n 30 "$RUNNER_TEMP/build.log"
            exit 1
          fi
          tail -n 5 "$RUNNER_TEMP/build.log"
          # Stała nazwa pliku: link .../releases/latest/download/MiTVLauncher.apk zawsze wskazuje najnowszą wersję.
          cp app/build/outputs/apk/release/app-release.apk MiTVLauncher.apk

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: MiTVLauncher-0.1.${{ github.run_number }}
          path: MiTVLauncher.apk
          retention-days: 3

      - name: Wydanie z APK
        if: env.LAUNCHER_KEYSTORE_PATH != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: MiTV Launcher 0.1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: MiTVLauncher.apk
          make_latest: true
